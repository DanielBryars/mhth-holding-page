<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>More Human Than Human</title>
  <meta name="description" content="morehumanthanhuman.com. Coming soon. Possibly.">
  <meta property="og:title" content="More Human Than Human">
  <meta property="og:description" content="All I want for Christmas...">
  <meta property="og:url" content="https://morehumanthanhuman.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0b1117">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b1117;
      --card: #111921;
      --text: #e8edf2;
      --muted: #9fb0c0;
      --ice: #8fd3ee;
      --gold: #f4c983;
      --rule: #2a3a48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #15212c 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    #snow {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .wrap { width: min(100%, 860px); }
    main {
      position: relative; z-index: 1;
      width: 100%; max-width: 1120px;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid #1c2733;
      border-radius: 22px;
      text-align: center;
      padding: 40px 28px 0;
      box-shadow: 0 30px 80px -30px rgba(0,0,0,.6);
      backdrop-filter: blur(2px);
    }
    .icons {
      display: flex; justify-content: center; gap: 14px;
      font-size: 22px; line-height: 1;
    }
    .icons .ice  { color: var(--ice); }
    .icons .star { color: var(--gold); }
    .eyebrow {
      margin-top: 30px;
      font-size: 14px; font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin-top: 40px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 500;
      letter-spacing: .01em;
      text-transform: uppercase;
    }
    .wish {
      margin-top: 22px;
      font-size: clamp(20px, 3vw, 28px);
      font-style: italic; font-weight: 600;
      color: var(--gold);
    }
    .reveal {
      margin-top: 14px;
      min-height: 1.5em;
      font-size: 15px;
      color: var(--muted);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 1.6s ease, transform 1.6s ease;
    }
    .reveal.on { opacity: 1; transform: none; }
    .reveal .price { color: var(--text); font-variant-numeric: tabular-nums; }
    hr {
      border: 0; border-top: 1px solid var(--rule);
      margin: 44px 0 0;
    }
    footer {
      padding: 26px 0 30px;
      font-size: 20px;
      color: var(--muted);
    }
    .small {
      position: relative; z-index: 1;
      margin-top: 18px;
      font-size: 12px;
      color: #5d6f80;
      text-align: center;
    }
    .small a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
    .small a:hover { color: var(--muted); }
    @media (max-width: 520px) {
      main { padding: 32px 18px 0; border-radius: 18px; }
      footer { font-size: 17px; }
    }
  </style>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <div class="wrap">
    <main>
      <div class="icons" aria-hidden="true">
        <span class="ice">❄</span><span class="star">✧</span><span class="ice">❄</span>
      </div>

      <p class="eyebrow">Season's greetings, humans</p>

      <h1>More Human Than Human</h1>

      <p class="wish">All I want for Christmas...</p>
      <p class="reveal" id="reveal">...is <span class="price">$1,000,000,000</span>. Cash or Dogecoin.</p>

      <hr>

      <footer>Coming soon. Possibly.</footer>
    </main>

    <p class="small">
      The world's most expensive domain name. Pending.
      &nbsp;·&nbsp; Serious enquiries via <a href="https://x.com/elonmusk" rel="noopener">the usual channels</a>.
    </p>
  </div>

  <script>
    // The punchline arrives late, as all good punchlines do.
    setTimeout(() => document.getElementById('reveal').classList.add('on'), 2800);

    // Snow.
    (() => {
      const canvas = document.getElementById('snow');
      const ctx = canvas.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, dpr, flakes = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const target = Math.round(Math.min(220, (w * h) / 7000));
        while (flakes.length < target) flakes.push(make(true));
        flakes.length = target;
      }

      function make(anywhere) {
        const z = Math.random();               // depth: 0 far, 1 near
        return {
          x: Math.random() * w,
          y: anywhere ? Math.random() * h : -10,
          r: 0.6 + z * 2.4,
          vy: 0.25 + z * 0.9,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.004 + Math.random() * 0.01,
          a: 0.25 + z * 0.6
        };
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const f of flakes) {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(235,243,250,${f.a})`;
          ctx.fill();
        }
      }

      let wind = 0, t = 0;
      function tick() {
        t += 1;
        wind = Math.sin(t / 600) * 0.35;
        for (const f of flakes) {
          f.sway += f.swaySpeed;
          f.y += f.vy;
          f.x += Math.sin(f.sway) * 0.35 + wind * (f.r / 2);
          if (f.y > h + 5) Object.assign(f, make(false));
          if (f.x > w + 5) f.x = -5;
          if (f.x < -5) f.x = w + 5;
        }
        draw();
        requestAnimationFrame(tick);
      }

      addEventListener('resize', resize);
      resize();
      still ? draw() : requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
